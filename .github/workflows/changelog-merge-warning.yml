name: Changelog merge warning

# pull_request_target runs in the context of the base repository, so the token can comment on PRs from forks.
# Do NOT check out or execute PR code here.
on:
  pull_request_target:
    types: [ closed ]

permissions:
  pull-requests: write

jobs:
  # warns the user if they merged the PR without a changelog entry
  warn_user_if_merged:
    name: Warn user if merged
    if: github.event.pull_request.merged == true && !contains(github.event.pull_request.body, '[x] No changelog needed')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - id: check
      name: Count changelog entries in the PR
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        count=$(gh api --paginate "repos/$REPO/pulls/$PR/files" \
          --jq '.[] | select(.status != "removed") | .filename | select(test("\\.changes\\."))' | wc -l)
        echo "count=$count" >> "$GITHUB_OUTPUT"
    - name: Remind the author with a comment
      if: steps.check.outputs.count == '0'
      uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 #v5.0.0
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          :warning: No changelog entry has been added. @${{ github.event.pull_request.user.login }}, please add necessary changelog entries with an additional PR.
